<html>
    <head>
        <meta charset="utf-8" name="viewport" 
            content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
        <link rel="stylesheet" href="css/fontIcon.css" />
        <link rel="stylesheet" href="css/fontAwsome.css" />
        <link rel="stylesheet" href="css/bulma.css" />
        <link rel="stylesheet" href="css/main.css" />
        <script src="js/vue.js"></script>
        <script src="js/vueResource.js"></script>
        <script src="js/jquery.js"></script>
        <script src="js/main.js"></script>
        <script src="js/data.js"></script>
        <!-- 标题 -->
        <title>Guide</title>
    </head>

    <body>
        <div id="app" class="fullHeight">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <div class="logo">Guide</div>
                </div>
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" placeholder="搜索站点、工具、资源...">
                </div>
                <div class="header-right">
                    <span class="settings-icon">⚙️</span>
                </div>
            </header>
            
            <!-- Main content -->
            <div class="main-content">
                <!-- Left sidebar navigation -->
                <aside class="column is-1-desktop is-3-mobile is-1-tablet">
                    <div class="guideTab">
                        <ul>
                            <li v-for="ele in guideTabListData" class="guideTabItem" v-on:click="tabSelected(ele)" :data-num="ele.num">
                                <a>
                                    <span class="guideTabItem-icon">📁</span>
                                    <span>{{ele.title}}</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </aside>
                
                <!-- Main content -->
                <main class="column is-11-desktop is-9-mobile is-11-tablet fullHeight">
                    <div class="container">
                        <div class="guideDetailList">
                            <div class="guideDetail" v-for="ele in currentGroupData" 
                        v-show="currentGroup != null" :id="ele.alt">
                                <a :href="ele.src">
                                    <img class="guideDetailImg" :src="getFaviconUrl(ele.src)" onerror="javascript:this.src='img/default.png';">
                                </a>
                                <div class="guideDetailContent">
                                    <a :href="ele.src" class="guideDetailAltWrapper">
                                        <h3 class="guideDatilAlt">{{ele.alt}}</h3>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <script type="text/javascript">
            // 检测是否为移动设备
            function isMobileDevice() {
                return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            }

            // 如果是移动设备，跳转到 mobile-ui.html
            if (isMobileDevice()) {
                window.location.href = 'mobile-ui.html';
            }

            // 初始化背景色
            setRgbColor();

            var vue = new Vue({
                el:"#app",
                data:{
                    guideTabListData: guideTabListData,
                    guideTabGroupListData: guideTabGroupListData,
                    currentGroup: null,
                    currentGroupData: new Array
                },
                methods:{ 
                    tabSelected:function(ele){
                        this.currentGroup = ele.num;
                        this.currentGroupData = this.guideTabGroupListData.filter((a) => a.num == this.currentGroup)[0].data;
                    },
                    getFaviconUrl:function(url){
                        let domain = url.split('/'); 
                        if(domain[0] && domain[2]) {
                            return domain[0] + "//" +  domain[2] + '/favicon.ico';
                        }
                        return 'img/default.png';
                    }
                }
            });
        </script>

    </body>

</html>
