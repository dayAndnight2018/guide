<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="banner" class="banner hidden"></div>

    <header class="header">
        <div class="title">🧭 Guide 导航</div>
        <div id="stat" class="stat"></div>
    </header>

    <div id="chips" class="chips"></div>

    <div class="toolbar">
        <input id="filter" type="text" placeholder="筛选当前分类…">
        <button id="btnAdd" class="btn small">＋ 添加当前页</button>
    </div>

    <div id="list" class="list"></div>

    <footer class="footer">
        <input id="msg" type="text" placeholder="提交说明（留空自动生成）">
        <div class="btns">
            <button id="btnSave" class="btn">仅保存</button>
            <button id="btnPush" class="btn primary">保存并推送</button>
        </div>
        <div id="hint" class="hint"></div>
    </footer>

    <div id="toast" class="toast hidden"></div>

    <script src="popup.js"></script>
</body>
</html>
